<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>creating with care...</title>
<meta name="description" content="creating with care...">
<meta property="og:title" content="creating with care...">
<meta property="og:description" content="creating with care...">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="creating with care...">
<meta name="twitter:description" content="creating with care...">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #ff7a1a;
  }
  body {
    height: 240vh;
  }
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .label-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .label {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Baloo 2", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    color: #ffe14d;
    font-size: 25.2px;
    text-align: center;
    white-space: nowrap;
  }
  #enableTilt {
    position: fixed;
    bottom: 24px;
    right: 24px;
    z-index: 2;
    font-family: "Baloo 2", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 14px;
    color: #ffe14d;
    background: rgba(0, 0, 0, 0.22);
    border: none;
    border-radius: 999px;
    padding: 10px 18px;
    display: none;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="canvas"></canvas>
  <div class="label-layer" id="labelLayer"></div>
</div>
<button id="enableTilt" type="button">enable tilt</button>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const labelLayer = document.getElementById('labelLayer');

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const words = [
    'creating', 'with', 'care',
    'creating', 'focus', 'with',
    'joy', 'creating', 'with',
    'creating', 'passion',
    'creating', 'with', 'delight',
    '', ''
  ];

  function rand(min, max) { return min + Math.random() * (max - min); }

  // overall visual scale of the whole pill system (font, padding, ring
  // thickness, blend softness) — keep this the single source of truth
  // so bumping it up never throws the proportions out of sync
  const SCALE = 1.2;

  const RING_WIDTH = 5 * SCALE;
  // how generously nearby pills blend into one another; bigger = softer
  const SOFTNESS = 26 * SCALE;
  const GRID_STEP = 3;

  const pills = words.map((label, i) => {
    const isCircle = label === '';
    // text box: drives physics/spacing so labels never overlap
    const w = isCircle ? 34 * SCALE : Math.max(80 * SCALE, label.length * 15.5 * SCALE + 20 * SCALE);
    const h = isCircle ? 34 * SCALE : 38 * SCALE;
    // outer fill size, kept close to the text box so the outline reads
    // as a snug ring rather than an oversized pill
    const wOuter = w + 10 * SCALE;
    const hOuter = h + 10 * SCALE;

    const text = document.createElement('div');
    text.className = 'label';
    text.style.width = w + 'px';
    text.style.height = h + 'px';
    text.textContent = label;
    labelLayer.appendChild(text);

    const homeX = window.innerWidth / 2 + rand(-window.innerWidth * 0.22, window.innerWidth * 0.22);
    const homeY = window.innerHeight / 2 + rand(-window.innerHeight * 0.2, window.innerHeight * 0.2);

    return {
      x: homeX,
      y: homeY,
      vx: rand(-0.2, 0.2),
      vy: rand(-0.2, 0.2),
      w, h, wOuter, hOuter, isCircle,
      rotBase: rand(-14, 14),
      seed: rand(0, 1000),
      text
    };
  });

  const mouse = { x: -9999, y: -9999, active: false };
  window.addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('pointerleave', () => { mouse.active = false; });

  // on touch devices, let the phone's tilt drive the same "cursor" the
  // pills already chase — calibrated from whatever angle the user is
  // holding the phone at when tilt is enabled, rather than an assumed
  // flat orientation
  const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const tiltBtn = document.getElementById('enableTilt');

  let baseBeta = null, baseGamma = null;
  function handleOrientation(e) {
    if (e.beta === null || e.gamma === null) return;
    if (baseBeta === null) { baseBeta = e.beta; baseGamma = e.gamma; }
    const dBeta = Math.max(-45, Math.min(45, e.beta - baseBeta));
    const dGamma = Math.max(-45, Math.min(45, e.gamma - baseGamma));
    mouse.x = window.innerWidth / 2 + (dGamma / 45) * (window.innerWidth / 2) * 0.9;
    mouse.y = window.innerHeight / 2 + (dBeta / 45) * (window.innerHeight / 2) * 0.9;
    mouse.active = true;
  }

  function enableTilt() {
    window.addEventListener('deviceorientation', handleOrientation);
    tiltBtn.style.display = 'none';
  }

  if (isTouchDevice && window.DeviceOrientationEvent) {
    tiltBtn.style.display = 'block';
    tiltBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') enableTilt();
        }).catch(() => {});
      } else {
        enableTilt();
      }
    });
  }

  let scrollP = 0;
  function updateScroll() {
    const max = document.body.scrollHeight - window.innerHeight;
    scrollP = max > 0 ? Math.min(1, Math.max(0, window.scrollY / max)) : 0;
  }
  window.addEventListener('scroll', updateScroll, { passive: true });
  updateScroll();

  // exact distance to a capsule (stadium) from point a to point b with
  // radius r; a circle is just the special case a === b
  function sdCapsule(px, py, ax, ay, bx, by, r) {
    const pax = px - ax, pay = py - ay, bax = bx - ax, bay = by - ay;
    const bb = bax * bax + bay * bay;
    const h = bb > 0 ? Math.max(0, Math.min(1, (pax * bax + pay * bay) / bb)) : 0;
    const dx = pax - bax * h, dy = pay - bay * h;
    return Math.sqrt(dx * dx + dy * dy) - r;
  }

  // polynomial smooth-minimum: blends two distance fields with a soft,
  // rounded transition instead of a hard crossing point. shapes that
  // are far apart (relative to k) fall back to an exact, undistorted min
  function smin(a, b, k) {
    const h = Math.max(k - Math.abs(a - b), 0) / k;
    return Math.min(a, b) - h * h * k * 0.25;
  }

  // marching-squares edge table: for each of the 16 corner-inside
  // combinations, which edges (T/R/B/L) get connected by a segment
  const CASES = {
    1: ['L', 'B'], 2: ['B', 'R'], 3: ['L', 'R'],
    4: ['T', 'R'], 6: ['T', 'B'], 7: ['T', 'L'],
    8: ['T', 'L'], 9: ['T', 'B'], 11: ['T', 'R'],
    12: ['L', 'R'], 13: ['B', 'R'], 14: ['L', 'B']
  };
  const AMBIGUOUS = { 5: [['T', 'L'], ['B', 'R']], 10: [['T', 'R'], ['B', 'L']] };

  // reused every frame instead of being reallocated, to cut GC churn
  const parent = new Int32Array(pills.length);
  const clusters = new Map();

  // reused across frames/clusters to avoid allocating a fresh typed
  // array 60 times a second, which was a source of GC-related stutter
  let scratch = new Float32Array(256 * 256);

  // packs an edge's type + grid coordinates into one integer so shared
  // edges between adjacent cells always resolve to the identical key —
  // an int key is much faster in a Map than building a string each time
  function edgeKeyInt(isHorizontal, i, j) {
    return (isHorizontal ? 1 : 0) * 16777216 + i * 4096 + j;
  }

  function marchCluster(group, minX, minY, maxX, maxY, step, drawChain) {
    const cols = Math.max(1, Math.ceil((maxX - minX) / step));
    const rows = Math.max(1, Math.ceil((maxY - minY) / step));
    const need = (cols + 1) * (rows + 1);
    if (scratch.length < need) scratch = new Float32Array(need);
    const vals = scratch;
    const stride = cols + 1;
    const n = group.length;

    // cheap bounding-circle center/radius per shape, used below to skip
    // shapes that are clearly too far from a sample point to matter —
    // this cuts cost without coarsening the grid (which just makes the
    // outline visibly faceted instead of actually being faster to draw)
    const rcx = new Float32Array(n), rcy = new Float32Array(n), rr = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      const p = group[k];
      rcx[k] = (p.ax + p.bx) / 2;
      rcy[k] = (p.ay + p.by) / 2;
      rr[k] = p.radius + Math.hypot(p.bx - p.ax, p.by - p.ay) / 2;
    }

    for (let j = 0; j <= rows; j++) {
      const py = minY + j * step;
      const rowBase = j * stride;
      for (let i = 0; i <= cols; i++) {
        const px = minX + i * step;
        let d = Infinity;
        for (let k = 0; k < n; k++) {
          if (k > 0) {
            const bx2 = px - rcx[k], by2 = py - rcy[k];
            const roughDist = Math.sqrt(bx2 * bx2 + by2 * by2) - rr[k];
            if (roughDist > d + SOFTNESS * 2) continue;
          }
          const p = group[k];
          const dp = sdCapsule(px, py, p.ax, p.ay, p.bx, p.by, p.radius);
          d = d === Infinity ? dp : smin(d, dp, SOFTNESS);
        }
        vals[rowBase + i] = d;
      }
    }

    const at = (i, j) => vals[j * stride + i];
    const edgePoint = (edge, i, j) => {
      const x0 = minX + i * step, y0 = minY + j * step;
      if (edge === 'T') {
        const v1 = at(i, j), v2 = at(i + 1, j);
        const t = v1 / (v1 - v2);
        return [x0 + t * step, y0];
      }
      if (edge === 'B') {
        const v1 = at(i, j + 1), v2 = at(i + 1, j + 1);
        const t = v1 / (v1 - v2);
        return [x0 + t * step, y0 + step];
      }
      if (edge === 'L') {
        const v1 = at(i, j), v2 = at(i, j + 1);
        const t = v1 / (v1 - v2);
        return [x0, y0 + t * step];
      }
      const v1 = at(i + 1, j), v2 = at(i + 1, j + 1);
      const t = v1 / (v1 - v2);
      return [x0 + step, y0 + t * step];
    };
    // top/bottom edges of adjacent cells (and left/right likewise) refer
    // to the exact same grid corners, so this always produces matching
    // keys for a shared edge regardless of which cell asks for it
    const edgeKey = (edge, i, j) => {
      if (edge === 'T') return edgeKeyInt(true, i, j);
      if (edge === 'B') return edgeKeyInt(true, i, j + 1);
      if (edge === 'L') return edgeKeyInt(false, i, j);
      return edgeKeyInt(false, i + 1, j);
    };

    // collect every crossing segment first, keyed by the grid edge each
    // endpoint sits on, then stitch them into continuous chains below —
    // stroking one connected path per contour instead of hundreds of
    // separate tiny segments is what removes the fuzzy/aliased seams
    const aKeys = [], bKeys = [], aPts = [], bPts = [];
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const tl = at(i, j) < 0, tr = at(i + 1, j) < 0;
        const br = at(i + 1, j + 1) < 0, bl = at(i, j + 1) < 0;
        const code = (tl ? 8 : 0) | (tr ? 4 : 0) | (br ? 2 : 0) | (bl ? 1 : 0);
        if (code === 0 || code === 15) continue;
        const pairsList = AMBIGUOUS[code] ? AMBIGUOUS[code] : (CASES[code] ? [CASES[code]] : []);
        for (let pi = 0; pi < pairsList.length; pi++) {
          const pair = pairsList[pi];
          aKeys.push(edgeKey(pair[0], i, j));
          bKeys.push(edgeKey(pair[1], i, j));
          aPts.push(edgePoint(pair[0], i, j));
          bPts.push(edgePoint(pair[1], i, j));
        }
      }
    }
    const segCount = aKeys.length;

    const adjacency = new Map();
    for (let s = 0; s < segCount; s++) {
      let arrA = adjacency.get(aKeys[s]);
      if (!arrA) { arrA = []; adjacency.set(aKeys[s], arrA); }
      arrA.push(bKeys[s], bPts[s], s);
      let arrB = adjacency.get(bKeys[s]);
      if (!arrB) { arrB = []; adjacency.set(bKeys[s], arrB); }
      arrB.push(aKeys[s], aPts[s], s);
    }

    const used = new Uint8Array(segCount);
    for (let startIdx = 0; startIdx < segCount; startIdx++) {
      if (used[startIdx]) continue;
      used[startIdx] = 1;
      const chain = [aPts[startIdx], bPts[startIdx]];
      let currentKey = bKeys[startIdx];
      while (true) {
        const arr = adjacency.get(currentKey);
        let found = -1;
        if (arr) {
          for (let m = 0; m < arr.length; m += 3) {
            if (!used[arr[m + 2]]) { found = m; break; }
          }
        }
        if (found < 0) break;
        used[arr[found + 2]] = 1;
        chain.push(arr[found + 1]);
        currentKey = arr[found];
      }
      drawChain(chain);
    }
  }

  function frame(now) {
    const time = now / 1000;
    const w = window.innerWidth, h = window.innerHeight;
    const cx = w / 2, cy = h / 2;

    pills.forEach(p => {
      const wanderX = Math.sin(time * 0.15 + p.seed) * 0.05;
      const wanderY = Math.cos(time * 0.13 + p.seed * 1.7) * 0.05;
      p.vx += wanderX * 0.03;
      p.vy += wanderY * 0.03;

      if (mouse.active) {
        const dx = mouse.x - p.x, dy = mouse.y - p.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        if (dist < 220) {
          const pull = (1 - dist / 220);
          p.vx += (dx / dist) * pull * 0.22;
          p.vy += (dy / dist) * pull * 0.22;
        }
      }

      // gentle pull toward the middle of the screen at rest, easing into
      // an outward push only once the user scrolls
      const tdx = p.x - cx, tdy = p.y - cy;
      const tdist = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
      // same magnitude both ways, so the pull back to center on the way
      // in matches the push outward on the way out during scroll
      const homeForce = (1 - scrollP) * -0.12 + scrollP * 0.12;
      p.vx += (tdx / tdist) * homeForce;
      p.vy += (tdy / tdist) * homeForce;
    });

    for (let a = 0; a < pills.length; a++) {
      for (let b = a + 1; b < pills.length; b++) {
        const pa = pills[a], pb = pills[b];
        const dx = pb.x - pa.x, dy = pb.y - pa.y;
        const dist = Math.sqrt(dx * dx + dy * dy) || 1;
        const minDist = (pa.w + pb.w) / 2 * 0.6;
        if (dist < minDist) {
          const push = (minDist - dist) / minDist * 0.18;
          const nx = dx / dist, ny = dy / dist;
          pa.vx -= nx * push; pa.vy -= ny * push;
          pb.vx += nx * push; pb.vy += ny * push;
        }
      }
    }

    pills.forEach(p => {
      p.vx *= 0.94;
      p.vy *= 0.94;
      const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
      const maxSpeed = 1.3;
      if (speed > maxSpeed) {
        p.vx = (p.vx / speed) * maxSpeed;
        p.vy = (p.vy / speed) * maxSpeed;
      }

      p.x += p.vx;
      p.y += p.vy;

      const margin = 10;
      if (p.x < margin) { p.x = margin; p.vx *= -0.6; }
      if (p.x > w - margin) { p.x = w - margin; p.vx *= -0.6; }
      if (p.y < margin) { p.y = margin; p.vy *= -0.6; }
      if (p.y > h - margin) { p.y = h - margin; p.vy *= -0.6; }
    });

    // hard separation pass: labels are never allowed to overlap, even
    // while the blob shapes visually touch or merge at the edges
    const pad = 6;
    for (let iter = 0; iter < 3; iter++) {
      for (let a = 0; a < pills.length; a++) {
        for (let b = a + 1; b < pills.length; b++) {
          const pa = pills[a], pb = pills[b];
          const dx = pb.x - pa.x, dy = pb.y - pa.y;
          const overlapX = (pa.w + pb.w) / 2 + pad - Math.abs(dx);
          const overlapY = (pa.h + pb.h) / 2 + pad - Math.abs(dy);
          if (overlapX > 0 && overlapY > 0) {
            if (overlapX < overlapY) {
              const sign = dx >= 0 ? 1 : -1;
              const shift = overlapX / 2;
              pa.x -= sign * shift; pb.x += sign * shift;
            } else {
              const sign = dy >= 0 ? 1 : -1;
              const shift = overlapY / 2;
              pa.y -= sign * shift; pb.y += sign * shift;
            }
          }
        }
      }
    }

    // finalize positions/rotation and each pill's exact capsule geometry
    pills.forEach(p => {
      const margin = 10;
      p.x = Math.min(Math.max(p.x, margin), w - margin);
      p.y = Math.min(Math.max(p.y, margin), h - margin);
      p.rot = p.rotBase + Math.sin(time * 0.4 + p.seed) * 4;

      const tf = `translate(${(p.x - p.w / 2).toFixed(1)}px, ${(p.y - p.h / 2).toFixed(1)}px) rotate(${p.rot.toFixed(1)}deg)`;
      p.text.style.transform = tf;

      const halfLen = Math.max(0, (p.wOuter - p.hOuter) / 2);
      const rad = p.rot * Math.PI / 180;
      const dx = Math.cos(rad) * halfLen, dy = Math.sin(rad) * halfLen;
      p.ax = p.x - dx; p.ay = p.y - dy;
      p.bx = p.x + dx; p.by = p.y + dy;
      p.radius = p.hOuter / 2;
    });

    // cluster pills by proximity so marching squares only runs over the
    // small local region where shapes actually meet; isolated pills get
    // their own tight box and render with their exact, untouched outline
    for (let i = 0; i < pills.length; i++) parent[i] = i;
    function find(i) { while (parent[i] !== i) i = parent[i]; return i; }
    function joinSets(i, j) {
      const ri = find(i), rj = find(j);
      if (ri !== rj) parent[ri] = rj;
    }
    for (let a = 0; a < pills.length; a++) {
      for (let b = a + 1; b < pills.length; b++) {
        const pa = pills[a], pb = pills[b];
        const dx = pb.x - pa.x, dy = pb.y - pa.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const reach = (pa.wOuter + pb.wOuter) / 2 + SOFTNESS;
        if (dist < reach) joinSets(a, b);
      }
    }
    clusters.clear();
    pills.forEach((p, i) => {
      const root = find(i);
      let group = clusters.get(root);
      if (!group) { group = []; clusters.set(root, group); }
      group.push(p);
    });

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#ffe14d';
    ctx.lineWidth = RING_WIDTH;
    // marching-squares segments meet at exactly matching coordinates
    // (verified: adjacent cells interpolate from the same shared corner
    // values), so round joins/caps buy nothing visually here — they were
    // just forcing the browser to rasterize a round cap on every one of
    // the many tiny segments, which got expensive fast on big clusters
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'butt';
    ctx.beginPath();

    clusters.forEach(group => {
      // raw extent of the shapes first, then pad ONCE at the end —
      // padding inside the loop compounded per shape and made bigger
      // clusters' search grids balloon far larger than they needed to be
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, maxRadius = 0;
      for (let i = 0; i < group.length; i++) {
        const p = group[i];
        minX = Math.min(minX, p.ax, p.bx);
        maxX = Math.max(maxX, p.ax, p.bx);
        minY = Math.min(minY, p.ay, p.by);
        maxY = Math.max(maxY, p.ay, p.by);
        maxRadius = Math.max(maxRadius, p.radius);
      }
      const pad = maxRadius + SOFTNESS + RING_WIDTH * 2;
      minX -= pad; maxX += pad;
      minY -= pad; maxY += pad;

      marchCluster(group, minX, minY, maxX, maxY, GRID_STEP, chain => {
        ctx.moveTo(chain[0][0], chain[0][1]);
        for (let i = 1; i < chain.length; i++) ctx.lineTo(chain[i][0], chain[i][1]);
      });
    });

    ctx.stroke();

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>

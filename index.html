<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Thunai - துணை</title>
<meta name="description" content="Thunai - துணை">
<meta property="og:title" content="Thunai - துணை">
<meta property="og:description" content="Thunai - துணை">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Thunai - துணை">
<meta name="twitter:description" content="Thunai - துணை">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@400;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    background: #ff7a1a;
    /* Safari's rubber-band overscroll snapping back reads as a fast,
       unintended scroll delta to the scatter/condense logic below —
       this asks the browser to skip that bounce where it's honored */
    overscroll-behavior-y: none;
  }
  body {
    height: 240vh;
  }
  .stage {
    position: fixed;
    inset: 0;
    overflow: hidden;
  }
  #canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }
  .label-layer {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .label {
    position: absolute;
    top: 0;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Baloo 2", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    color: #ffe14d;
    font-size: 25.2px;
    text-align: center;
    white-space: nowrap;
  }
  #enableTilt {
    position: fixed;
    top: 24px;
    left: 24px;
    z-index: 2;
    font-family: "Baloo 2", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 700;
    font-size: 17px;
    color: #ffe14d;
    background: rgba(0, 0, 0, 0.22);
    border: none;
    border-radius: 999px;
    padding: 13px 22px;
    display: none;
  }
  .footer-note {
    position: fixed;
    left: 0;
    right: 0;
    bottom: max(18px, env(safe-area-inset-bottom));
    z-index: 1;
    text-align: center;
    font-family: "Baloo 2", "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-weight: 400;
    font-size: 14px;
    color: rgba(0, 0, 0, 0.4);
    padding: 0 20px;
    pointer-events: none;
  }
</style>
</head>
<body>
<div class="stage">
  <canvas id="canvas"></canvas>
  <div class="label-layer" id="labelLayer"></div>
</div>
<button id="enableTilt" type="button">enable tilt</button>
<div class="footer-note">Thunai (துணை) means help, support, companionship, or protector in Tamil</div>

<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const labelLayer = document.getElementById('labelLayer');

  function resizeCanvas() {
    const dpr = window.devicePixelRatio || 1;
    canvas.width = window.innerWidth * dpr;
    canvas.height = window.innerHeight * dpr;
    canvas.style.width = window.innerWidth + 'px';
    canvas.style.height = window.innerHeight + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener('resize', resizeCanvas);
  resizeCanvas();

  const MOUSE_ENABLED = true;

  // the first 5*3 = 15 entries are five "creating with <feeling>" rows,
  // read in this exact order — the initial layout below depends on that
  // grouping. the trailing two empty strings are plain decorative
  // circles, not part of any row.
  const words = [
    'creating', 'with', 'joy',
    'creating', 'with', 'focus',
    'creating', 'with', 'passion',
    'creating', 'with', 'delight',
    'creating', 'with', 'care',
    '', ''
  ];
  const ROW_COUNT = 5, ROW_COLS = 3;

  function rand(min, max) { return min + Math.random() * (max - min); }

  // overall visual scale of the whole pill system (font, padding, ring
  // thickness, blend softness) — keep this the single source of truth
  // so bumping it up never throws the proportions out of sync
  const SCALE = 1.2;

  const RING_WIDTH = 5 * SCALE;
  // how generously nearby pills blend into one another; bigger = softer
  const SOFTNESS = 26 * SCALE;
  const GRID_STEP = 3;

  // each word's outer box size, purely a function of its text — the same
  // formula the pill objects below use, computed up front so the initial
  // row layout can place pills edge-to-edge before any pill exists
  function wordBox(label) {
    const isCircle = label === '';
    const w = isCircle ? 34 * SCALE : Math.max(80 * SCALE, label.length * 15.5 * SCALE + 20 * SCALE);
    const h = isCircle ? 34 * SCALE : 38 * SCALE;
    return { w: w + 10 * SCALE, h: h + 10 * SCALE };
  }

  // starting layout: five merged "creating with <feeling>" rows, stacked
  // and centered on the page. the gap between words in a row is kept
  // well under SOFTNESS so each row renders as one continuous merged
  // shape from the very first frame, the same way a mid-scatter cluster
  // does — just tidy instead of scattered.
  const ROW_MERGE_GAP = 8 * SCALE;
  const ROW_STACK_GAP = 14 * SCALE;
  const rowCenters = []; // rowCenters[row][col] -> x offset from page center
  const rowY = [];       // rowY[row] -> y offset from page center
  {
    const rowHeights = [];
    for (let r = 0; r < ROW_COUNT; r++) {
      const boxes = words.slice(r * ROW_COLS, r * ROW_COLS + ROW_COLS).map(wordBox);
      const totalW = boxes.reduce((s, b) => s + b.w, 0) + ROW_MERGE_GAP * (ROW_COLS - 1);
      let cursor = -totalW / 2;
      rowCenters.push(boxes.map(b => {
        const c = cursor + b.w / 2;
        cursor += b.w + ROW_MERGE_GAP;
        return c;
      }));
      rowHeights.push(Math.max(...boxes.map(b => b.h)));
    }
    const totalH = rowHeights.reduce((s, rh) => s + rh, 0) + ROW_STACK_GAP * (ROW_COUNT - 1);
    let cursorY = -totalH / 2;
    for (let r = 0; r < ROW_COUNT; r++) {
      rowY.push(cursorY + rowHeights[r] / 2);
      cursorY += rowHeights[r] + ROW_STACK_GAP;
    }
  }

  const pills = words.map((label, i) => {
    const isCircle = label === '';
    // text box: drives physics/spacing so labels never overlap
    const w = isCircle ? 34 * SCALE : Math.max(80 * SCALE, label.length * 15.5 * SCALE + 20 * SCALE);
    const h = isCircle ? 34 * SCALE : 38 * SCALE;
    // outer fill size, kept close to the text box so the outline reads
    // as a snug ring rather than an oversized pill
    const wOuter = w + 10 * SCALE;
    const hOuter = h + 10 * SCALE;

    const text = document.createElement('div');
    text.className = 'label';
    text.style.width = w + 'px';
    text.style.height = h + 'px';
    text.textContent = label;
    labelLayer.appendChild(text);

    // start each word pill in its row-formation slot; the two trailing
    // empty-string pills are the decorative circles, tucked into
    // opposite corners with plenty of clearance so they read as
    // separate shapes rather than merging into the row block
    let homeX, homeY;
    if (i < ROW_COUNT * ROW_COLS) {
      const row = Math.floor(i / ROW_COLS), col = i % ROW_COLS;
      homeX = window.innerWidth / 2 + rowCenters[row][col];
      homeY = window.innerHeight / 2 + rowY[row];
    } else {
      const corner = i - ROW_COUNT * ROW_COLS;
      homeX = window.innerWidth * (corner === 0 ? 0.14 : 0.86);
      homeY = window.innerHeight * (corner === 0 ? 0.16 : 0.84);
    }

    // how far this pill's own outline can reach from its center point —
    // used to keep the boundary clamp on the OUTLINE, not just the
    // center, so nothing pokes past the page edge. exact half-extent
    // plus half the stroke width, so the outline can reach all the way
    // to the page edge but never draws past it
    const margin = Math.max(0, (wOuter - hOuter) / 2) + hOuter / 2 + RING_WIDTH / 2;

    return {
      x: homeX,
      y: homeY,
      vx: rand(-0.2, 0.2),
      vy: rand(-0.2, 0.2),
      w, h, wOuter, hOuter, isCircle, margin,
      rotBase: rand(-14, 14),
      seed: rand(0, 1000),
      text
    };
  });

  const mouse = { x: -9999, y: -9999, active: false };
  window.addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  });
  window.addEventListener('pointerleave', () => { mouse.active = false; });

  // on touch devices, let the phone's tilt drive the same "cursor" the
  // pills already chase. left-right (gamma) is calibrated from whatever
  // angle the user is holding the phone at when tilt is enabled, since
  // there's no universal "neutral" side-tilt. front-back (beta) instead
  // uses the actual physical angle: roughly 0°-90° is the range where
  // someone can tilt a phone and still comfortably look at the screen,
  // and ~60° is a natural resting hold, so that's mapped to screen center
  const isTouchDevice = window.matchMedia('(pointer: coarse)').matches || 'ontouchstart' in window;
  const tiltBtn = document.getElementById('enableTilt');

  // tracks whether the "cursor" is currently being driven by tilt rather
  // than a real mouse pointer, so the on-screen target dot only shows up
  // when it's the sole way to see where the cursor is (touch/tilt) —
  // not on desktop, where the real pointer is already visible
  let tiltActive = false;

  const BETA_MIN = 0, BETA_CENTER = 60, BETA_MAX = 90;

  let baseGamma = null;
  function handleOrientation(e) {
    if (e.beta === null || e.gamma === null) return;
    if (baseGamma === null) baseGamma = e.gamma;
    const dGamma = Math.max(-45, Math.min(45, e.gamma - baseGamma));
    let tx = window.innerWidth / 2 + (dGamma / 45) * (window.innerWidth / 2) * 0.9;

    // piecewise-linear: center (0 offset) at 60°, clamped ends at 0°
    // and 90° — the two halves aren't equal width, so each is scaled
    // against its own span rather than one shared ±range
    const beta = Math.max(BETA_MIN, Math.min(BETA_MAX, e.beta));
    const nBeta = beta <= BETA_CENTER
      ? (beta - BETA_CENTER) / (BETA_CENTER - BETA_MIN)
      : (beta - BETA_CENTER) / (BETA_MAX - BETA_CENTER);
    let ty = window.innerHeight / 2 + nBeta * (window.innerHeight / 2) * 0.9;

    // near beta = 90° (phone held upright — the far end of our range,
    // which lands in the bottom half of the screen) the orientation
    // sensor's own angles become unstable (a known gimbal-lock zone in
    // the device orientation spec), which can spike gamma/beta readings
    // for a frame or two. clamp the final point to just inside the
    // viewport so a bad reading can't send the dot past the edge.
    const EDGE_PAD = 16;
    tx = Math.max(EDGE_PAD, Math.min(window.innerWidth - EDGE_PAD, tx));
    ty = Math.max(EDGE_PAD, Math.min(window.innerHeight - EDGE_PAD, ty));
    mouse.x = tx;
    mouse.y = ty;
    mouse.active = true;
    tiltActive = true;
  }

  function enableTilt() {
    window.addEventListener('deviceorientation', handleOrientation);
    tiltBtn.style.display = 'none';
  }

  if (isTouchDevice && window.DeviceOrientationEvent) {
    tiltBtn.style.display = 'block';
    tiltBtn.addEventListener('click', () => {
      if (typeof DeviceOrientationEvent.requestPermission === 'function') {
        DeviceOrientationEvent.requestPermission().then(state => {
          if (state === 'granted') enableTilt();
        }).catch(() => {});
      } else {
        enableTilt();
      }
    });
  }

  // scroll direction (not position) drives the pills: scrolling down
  // always scatters them outward, scrolling up always condenses them
  // back in. scrollVel is a lightly smoothed, SIGNED velocity (+ down,
  // - up) so the force tracks scroll direction moment to moment without
  // being jittery frame to frame
  let lastScrollY = window.scrollY;
  let scrollVel = 0;
  let lastScrollActivity = -Infinity;

  // pills start pinned in the five-row formation with no physics running
  // at all — the very first scroll (any direction) is what wakes the
  // whole simulation up and lets it scatter into free motion
  let hasScattered = false;

  // exact distance to a capsule (stadium) from point a to point b with
  // radius r; a circle is just the special case a === b
  function sdCapsule(px, py, ax, ay, bx, by, r) {
    const pax = px - ax, pay = py - ay, bax = bx - ax, bay = by - ay;
    const bb = bax * bax + bay * bay;
    const h = bb > 0 ? Math.max(0, Math.min(1, (pax * bax + pay * bay) / bb)) : 0;
    const dx = pax - bax * h, dy = pay - bay * h;
    return Math.sqrt(dx * dx + dy * dy) - r;
  }

  // polynomial smooth-minimum: blends two distance fields with a soft,
  // rounded transition instead of a hard crossing point. shapes that
  // are far apart (relative to k) fall back to an exact, undistorted min
  function smin(a, b, k) {
    const h = Math.max(k - Math.abs(a - b), 0) / k;
    return Math.min(a, b) - h * h * k * 0.25;
  }

  // marching-squares edge table: for each of the 16 corner-inside
  // combinations, which edges (T/R/B/L) get connected by a segment
  const CASES = {
    1: ['L', 'B'], 2: ['B', 'R'], 3: ['L', 'R'],
    4: ['T', 'R'], 6: ['T', 'B'], 7: ['T', 'L'],
    8: ['T', 'L'], 9: ['T', 'B'], 11: ['T', 'R'],
    12: ['L', 'R'], 13: ['B', 'R'], 14: ['L', 'B']
  };
  const AMBIGUOUS = { 5: [['T', 'L'], ['B', 'R']], 10: [['T', 'R'], ['B', 'L']] };

  // reused every frame instead of being reallocated, to cut GC churn
  const parent = new Int32Array(pills.length);
  const clusters = new Map();

  // reused across frames/clusters to avoid allocating a fresh typed
  // array 60 times a second, which was a source of GC-related stutter
  let scratch = new Float32Array(256 * 256);

  // packs an edge's type + grid coordinates into one integer so shared
  // edges between adjacent cells always resolve to the identical key —
  // an int key is much faster in a Map than building a string each time
  function edgeKeyInt(isHorizontal, i, j) {
    return (isHorizontal ? 1 : 0) * 16777216 + i * 4096 + j;
  }

  function marchCluster(group, minX, minY, maxX, maxY, step, drawChain) {
    const cols = Math.max(1, Math.ceil((maxX - minX) / step));
    const rows = Math.max(1, Math.ceil((maxY - minY) / step));
    const need = (cols + 1) * (rows + 1);
    if (scratch.length < need) scratch = new Float32Array(need);
    const vals = scratch;
    const stride = cols + 1;
    const n = group.length;

    // cheap bounding-circle center/radius per shape, used below to skip
    // shapes that are clearly too far from a sample point to matter —
    // this cuts cost without coarsening the grid (which just makes the
    // outline visibly faceted instead of actually being faster to draw)
    const rcx = new Float32Array(n), rcy = new Float32Array(n), rr = new Float32Array(n);
    for (let k = 0; k < n; k++) {
      const p = group[k];
      rcx[k] = (p.ax + p.bx) / 2;
      rcy[k] = (p.ay + p.by) / 2;
      rr[k] = p.radius + Math.hypot(p.bx - p.ax, p.by - p.ay) / 2;
    }

    for (let j = 0; j <= rows; j++) {
      const py = minY + j * step;
      const rowBase = j * stride;
      for (let i = 0; i <= cols; i++) {
        const px = minX + i * step;
        let d = Infinity;
        for (let k = 0; k < n; k++) {
          if (k > 0) {
            const bx2 = px - rcx[k], by2 = py - rcy[k];
            const roughDist = Math.sqrt(bx2 * bx2 + by2 * by2) - rr[k];
            if (roughDist > d + SOFTNESS * 2) continue;
          }
          const p = group[k];
          const dp = sdCapsule(px, py, p.ax, p.ay, p.bx, p.by, p.radius);
          d = d === Infinity ? dp : smin(d, dp, SOFTNESS);
        }
        vals[rowBase + i] = d;
      }
    }

    const at = (i, j) => vals[j * stride + i];
    const edgePoint = (edge, i, j) => {
      const x0 = minX + i * step, y0 = minY + j * step;
      if (edge === 'T') {
        const v1 = at(i, j), v2 = at(i + 1, j);
        const t = v1 / (v1 - v2);
        return [x0 + t * step, y0];
      }
      if (edge === 'B') {
        const v1 = at(i, j + 1), v2 = at(i + 1, j + 1);
        const t = v1 / (v1 - v2);
        return [x0 + t * step, y0 + step];
      }
      if (edge === 'L') {
        const v1 = at(i, j), v2 = at(i, j + 1);
        const t = v1 / (v1 - v2);
        return [x0, y0 + t * step];
      }
      const v1 = at(i + 1, j), v2 = at(i + 1, j + 1);
      const t = v1 / (v1 - v2);
      return [x0 + step, y0 + t * step];
    };
    // top/bottom edges of adjacent cells (and left/right likewise) refer
    // to the exact same grid corners, so this always produces matching
    // keys for a shared edge regardless of which cell asks for it
    const edgeKey = (edge, i, j) => {
      if (edge === 'T') return edgeKeyInt(true, i, j);
      if (edge === 'B') return edgeKeyInt(true, i, j + 1);
      if (edge === 'L') return edgeKeyInt(false, i, j);
      return edgeKeyInt(false, i + 1, j);
    };

    // collect every crossing segment first, keyed by the grid edge each
    // endpoint sits on, then stitch them into continuous chains below —
    // stroking one connected path per contour instead of hundreds of
    // separate tiny segments is what removes the fuzzy/aliased seams
    const aKeys = [], bKeys = [], aPts = [], bPts = [];
    for (let j = 0; j < rows; j++) {
      for (let i = 0; i < cols; i++) {
        const tl = at(i, j) < 0, tr = at(i + 1, j) < 0;
        const br = at(i + 1, j + 1) < 0, bl = at(i, j + 1) < 0;
        const code = (tl ? 8 : 0) | (tr ? 4 : 0) | (br ? 2 : 0) | (bl ? 1 : 0);
        if (code === 0 || code === 15) continue;
        const pairsList = AMBIGUOUS[code] ? AMBIGUOUS[code] : (CASES[code] ? [CASES[code]] : []);
        for (let pi = 0; pi < pairsList.length; pi++) {
          const pair = pairsList[pi];
          aKeys.push(edgeKey(pair[0], i, j));
          bKeys.push(edgeKey(pair[1], i, j));
          aPts.push(edgePoint(pair[0], i, j));
          bPts.push(edgePoint(pair[1], i, j));
        }
      }
    }
    const segCount = aKeys.length;

    const adjacency = new Map();
    for (let s = 0; s < segCount; s++) {
      let arrA = adjacency.get(aKeys[s]);
      if (!arrA) { arrA = []; adjacency.set(aKeys[s], arrA); }
      arrA.push(bKeys[s], bPts[s], s);
      let arrB = adjacency.get(bKeys[s]);
      if (!arrB) { arrB = []; adjacency.set(bKeys[s], arrB); }
      arrB.push(aKeys[s], aPts[s], s);
    }

    const used = new Uint8Array(segCount);
    for (let startIdx = 0; startIdx < segCount; startIdx++) {
      if (used[startIdx]) continue;
      used[startIdx] = 1;
      const chain = [aPts[startIdx], bPts[startIdx]];
      let currentKey = bKeys[startIdx];
      while (true) {
        const arr = adjacency.get(currentKey);
        let found = -1;
        if (arr) {
          for (let m = 0; m < arr.length; m += 3) {
            if (!used[arr[m + 2]]) { found = m; break; }
          }
        }
        if (found < 0) break;
        used[arr[found + 2]] = 1;
        chain.push(arr[found + 1]);
        currentKey = arr[found];
      }
      drawChain(chain);
    }
  }

  function frame(now) {
    const time = now / 1000;
    const w = window.innerWidth, h = window.innerHeight;
    const cx = w / 2, cy = h / 2;

    // clamp to the real scrollable range before diffing — Safari's
    // rubber-band overscroll lets scrollY swing outside [0, maxScroll]
    // and then spring back, and that spring-back is itself a fast,
    // non-user-driven delta that would otherwise fire a spurious
    // scatter or condense. clamping first means that excursion (and
    // its return) shows up as sitting still at the boundary instead.
    const maxScrollY = Math.max(0, document.body.scrollHeight - window.innerHeight);
    const currentScrollY = Math.min(maxScrollY, Math.max(0, window.scrollY));
    const rawScrollDelta = currentScrollY - lastScrollY;
    lastScrollY = currentScrollY;
    scrollVel = scrollVel * 0.8 + rawScrollDelta * 0.2;

    // the very first scroll — either direction — is what wakes the
    // simulation up. before that, pills stay pinned exactly in their
    // row-formation slots with no forces applied at all.
    if (Math.abs(rawScrollDelta) > 0.3) {
      hasScattered = true;
      lastScrollActivity = now;
    }

    if (hasScattered) {
      // how "fresh" the last scroll motion is, from 1 (just happened) to
      // 0 (a couple seconds ago or more) — used below both for the
      // scroll force itself and to temporarily raise the speed limit,
      // since a fixed low speed cap was quietly capping scatter/condense
      // to a crawl no matter how strong the underlying push was
      const FRESH_MS = 2500;
      const scrollT = Math.max(-1, Math.min(1, scrollVel / 4));
      const freshness = Math.max(0, 1 - (now - lastScrollActivity) / FRESH_MS);

      pills.forEach(p => {
        const wanderX = Math.sin(time * 0.15 + p.seed) * 0.05;
        const wanderY = Math.cos(time * 0.13 + p.seed * 1.7) * 0.05;
        p.vx += wanderX * 0.03;
        p.vy += wanderY * 0.03;

        if (MOUSE_ENABLED && mouse.active) {
          const dx = mouse.x - p.x, dy = mouse.y - p.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          if (dist < 260) {
            const pull = (1 - dist / 260);
            p.vx += (dx / dist) * pull * 0.4;
            p.vy += (dy / dist) * pull * 0.4;
          }
        }

        // scrolling down always scatters pills outward; scrolling up
        // always condenses them back in — direction maps directly to
        // direction, no ambiguity. condense is still the stronger of
        // the two (same bias as before) so pills gather back faster
        // than they spread out, and it settles to zero the moment
        // scrolling stops.
        const tdx = p.x - cx, tdy = p.y - cy;
        const tdist = Math.sqrt(tdx * tdx + tdy * tdy) || 1;
        const homeForce = scrollT > 0 ? scrollT * 0.9 : scrollT * 1.1;
        p.vx += (tdx / tdist) * homeForce;
        p.vy += (tdy / tdist) * homeForce;

        // soft cushion near each wall: ramps in the closer a pill gets
        // (lead-in) and fades right back out as it moves away after the
        // bounce (lead-out) — it's just a function of current distance,
        // so both directions fall out of the same formula for free. kept
        // light enough that it only takes the edge off the bounce instead
        // of stopping pills short of the wall — the outline should still
        // be able to reach all the way to it
        const WALL_ZONE = 22;
        const distLeft = p.x - p.margin;
        if (distLeft < WALL_ZONE) {
          const t = Math.max(0, 1 - distLeft / WALL_ZONE);
          p.vx += t * t * 0.12;
        }
        const distRight = (w - p.margin) - p.x;
        if (distRight < WALL_ZONE) {
          const t = Math.max(0, 1 - distRight / WALL_ZONE);
          p.vx -= t * t * 0.12;
        }
        const distTop = p.y - p.margin;
        if (distTop < WALL_ZONE) {
          const t = Math.max(0, 1 - distTop / WALL_ZONE);
          p.vy += t * t * 0.12;
        }
        const distBottom = (h - p.margin) - p.y;
        if (distBottom < WALL_ZONE) {
          const t = Math.max(0, 1 - distBottom / WALL_ZONE);
          p.vy -= t * t * 0.12;
        }
      });

      for (let a = 0; a < pills.length; a++) {
        for (let b = a + 1; b < pills.length; b++) {
          const pa = pills[a], pb = pills[b];
          const dx = pb.x - pa.x, dy = pb.y - pa.y;
          const dist = Math.sqrt(dx * dx + dy * dy) || 1;
          const minDist = (pa.w + pb.w) / 2 * 0.6;
          if (dist < minDist) {
            const push = (minDist - dist) / minDist * 0.18;
            const nx = dx / dist, ny = dy / dist;
            pa.vx -= nx * push; pa.vy -= ny * push;
            pb.vx += nx * push; pb.vy += ny * push;
          }
        }
      }

      // the speed cap itself, not the push strength, was the real
      // bottleneck: a constant push this strong reaches ANY cap within a
      // few frames, so the cap alone decided how far pills could travel.
      // raise it while a scroll is fresh so scatter/condense can
      // actually cross the page, easing back to the calm resting cap as
      // that freshness fades.
      const maxSpeedNow = 1.3 + freshness * 9;

      pills.forEach(p => {
        p.vx *= 0.94;
        p.vy *= 0.94;
        const speed = Math.sqrt(p.vx * p.vx + p.vy * p.vy);
        const maxSpeed = maxSpeedNow;
        if (speed > maxSpeed) {
          p.vx = (p.vx / speed) * maxSpeed;
          p.vy = (p.vy / speed) * maxSpeed;
        }

        p.x += p.vx;
        p.y += p.vy;

        const margin = p.margin;
        if (p.x < margin) { p.x = margin; p.vx *= -0.35; }
        if (p.x > w - margin) { p.x = w - margin; p.vx *= -0.35; }
        if (p.y < margin) { p.y = margin; p.vy *= -0.35; }
        if (p.y > h - margin) { p.y = h - margin; p.vy *= -0.35; }
      });

      // hard separation pass: labels are never allowed to overlap, even
      // while the blob shapes visually touch or merge at the edges
      const pad = 6;
      for (let iter = 0; iter < 3; iter++) {
        for (let a = 0; a < pills.length; a++) {
          for (let b = a + 1; b < pills.length; b++) {
            const pa = pills[a], pb = pills[b];
            const dx = pb.x - pa.x, dy = pb.y - pa.y;
            const overlapX = (pa.w + pb.w) / 2 + pad - Math.abs(dx);
            const overlapY = (pa.h + pb.h) / 2 + pad - Math.abs(dy);
            if (overlapX > 0 && overlapY > 0) {
              if (overlapX < overlapY) {
                const sign = dx >= 0 ? 1 : -1;
                const shift = overlapX / 2;
                pa.x -= sign * shift; pb.x += sign * shift;
              } else {
                const sign = dy >= 0 ? 1 : -1;
                const shift = overlapY / 2;
                pa.y -= sign * shift; pb.y += sign * shift;
              }
            }
          }
        }
      }
    }

    // finalize positions/rotation and each pill's exact capsule geometry
    pills.forEach(p => {
      const margin = p.margin;
      p.x = Math.min(Math.max(p.x, margin), w - margin);
      p.y = Math.min(Math.max(p.y, margin), h - margin);
      // stay flat and tidy in the row formation; only start the gentle
      // per-pill wobble once things have scattered into free motion
      p.rot = hasScattered ? p.rotBase + Math.sin(time * 0.4 + p.seed) * 4 : 0;

      const tf = `translate(${(p.x - p.w / 2).toFixed(1)}px, ${(p.y - p.h / 2).toFixed(1)}px) rotate(${p.rot.toFixed(1)}deg)`;
      p.text.style.transform = tf;

      const radius = p.hOuter / 2;
      const halfLen = Math.max(0, (p.wOuter - p.hOuter) / 2);

      const rad = p.rot * Math.PI / 180;
      const dx = Math.cos(rad) * halfLen, dy = Math.sin(rad) * halfLen;
      p.ax = p.x - dx; p.ay = p.y - dy;
      p.bx = p.x + dx; p.by = p.y + dy;
      p.radius = radius;
    });

    // cluster pills by proximity so marching squares only runs over the
    // small local region where shapes actually meet; isolated pills get
    // their own tight box and render with their exact, untouched outline
    for (let i = 0; i < pills.length; i++) parent[i] = i;
    function find(i) { while (parent[i] !== i) i = parent[i]; return i; }
    function joinSets(i, j) {
      const ri = find(i), rj = find(j);
      if (ri !== rj) parent[ri] = rj;
    }
    for (let a = 0; a < pills.length; a++) {
      for (let b = a + 1; b < pills.length; b++) {
        const pa = pills[a], pb = pills[b];
        const dx = pb.x - pa.x, dy = pb.y - pa.y;
        const dist = Math.sqrt(dx * dx + dy * dy);
        const reach = (pa.wOuter + pb.wOuter) / 2 + SOFTNESS;
        if (dist < reach) joinSets(a, b);
      }
    }
    clusters.clear();
    pills.forEach((p, i) => {
      const root = find(i);
      let group = clusters.get(root);
      if (!group) { group = []; clusters.set(root, group); }
      group.push(p);
    });

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = '#ffe14d';
    ctx.lineWidth = RING_WIDTH;
    // marching-squares segments meet at exactly matching coordinates
    // (verified: adjacent cells interpolate from the same shared corner
    // values), so round joins/caps buy nothing visually here — they were
    // just forcing the browser to rasterize a round cap on every one of
    // the many tiny segments, which got expensive fast on big clusters
    ctx.lineJoin = 'miter';
    ctx.lineCap = 'butt';
    ctx.beginPath();

    clusters.forEach(group => {
      // raw extent of the shapes first, then pad ONCE at the end —
      // padding inside the loop compounded per shape and made bigger
      // clusters' search grids balloon far larger than they needed to be
      let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity, maxRadius = 0;
      for (let i = 0; i < group.length; i++) {
        const p = group[i];
        minX = Math.min(minX, p.ax, p.bx);
        maxX = Math.max(maxX, p.ax, p.bx);
        minY = Math.min(minY, p.ay, p.by);
        maxY = Math.max(maxY, p.ay, p.by);
        maxRadius = Math.max(maxRadius, p.radius);
      }
      const pad = maxRadius + SOFTNESS + RING_WIDTH * 2;
      minX -= pad; maxX += pad;
      minY -= pad; maxY += pad;

      marchCluster(group, minX, minY, maxX, maxY, GRID_STEP, chain => {
        ctx.moveTo(chain[0][0], chain[0][1]);
        for (let i = 1; i < chain.length; i++) ctx.lineTo(chain[i][0], chain[i][1]);
      });
    });

    ctx.stroke();

    // a visible target where the "cursor" actually is right now — only
    // for tilt on touch devices, where there's no real pointer to see,
    // so this is the only way to tell it's tracking at all. hidden on
    // desktop, where the real mouse pointer already shows this.
    if (MOUSE_ENABLED && tiltActive && mouse.active) {
      ctx.beginPath();
      ctx.fillStyle = '#ffe14d';
      ctx.arc(mouse.x, mouse.y, 6 * SCALE, 0, Math.PI * 2);
      ctx.fill();
    }

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>
